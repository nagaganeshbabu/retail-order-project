name: Retail Orders CI/CD

on:
  pull_request:
    branches:
      - feature

  push:
    branches:
      - feature

permissions:
  contents: read

jobs:
  # Job 1: Test the application
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check project structure
        run: |
          pwd
          ls -la
          ls -la app
          ls -la tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Docker build
        run: docker build -t retail-orders:test .

  # Job 2: Build, push, and deploy
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/feature'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER }}
      REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_NAME: retail-orders-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Verify Google Cloud authentication
      - name: Verify Google Cloud authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking authenticated Google Cloud account..."
          gcloud auth list

          echo "Checking configured project..."
          gcloud config get-value project

          echo "Checking Artifact Registry variables..."
          printf 'Project ID: %s\n' "$PROJECT_ID"
          printf 'Region: %s\n' "$REGION"
          printf 'Repository: %s\n' "$REPOSITORY"

      # Configure Docker credentials for Artifact Registry
      - name: Configure Docker authentication
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${REGION}-docker.pkg.dev"

          echo "Configuring Docker authentication for ${REGISTRY}..."

          gcloud auth configure-docker "${REGISTRY}" --quiet

          echo "Checking Docker credential helper configuration..."

          python -c '
          import json
          import os

          path = os.path.expanduser("~/.docker/config.json")

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          registry = os.environ["REGION"] + "-docker.pkg.dev"
          helper = config.get("credHelpers", {}).get(registry)

          if helper != "gcloud":
              raise SystemExit(
                  f"Expected gcloud credential helper for {registry}; "
                  f"found {helper!r}"
              )

          print(f"Credential helper configured for {registry}")
          '

      # Build and push Docker image
      - name: Build and push image
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PROJECT_ID="$(printf '%s' "$PROJECT_ID" | tr -d '\r\n' | xargs)"
          REGION="$(printf '%s' "$REGION" | tr -d '\r\n' | xargs)"
          REPOSITORY="$(printf '%s' "$REPOSITORY" | tr -d '\r\n' | xargs)"

          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

          echo "Building image: ${IMAGE_URI}"

          docker build -t "${IMAGE_URI}" .

          echo "Pushing image to Artifact Registry..."

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Image pushed successfully."

      # Connect to GKE
      - name: Connect to GKE
        shell: bash
        run: |
          set -euo pipefail

          gcloud container clusters get-credentials "${CLUSTER_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}"

      # Deploy application
      - name: Deploy application
        shell: bash
        run: |
          set -euo pipefail

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            k8s/deployment.yaml > /tmp/deployment.yaml

          kubectl apply -f /tmp/deployment.yaml

          kubectl rollout status deployment/retail-orders \
            --timeout=180s

      # Verify deployment
      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          kubectl get deployment retail-orders
          kubectl get pods -l app=retail-orders -o wide
          kubectl get services