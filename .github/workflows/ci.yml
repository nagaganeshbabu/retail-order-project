name: Retail Orders CI/CD Pipeline

on:
  pull_request:
    branches:
      - feature

  push:
    branches:
      - feature

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: PYTHON TESTING AND DOCKER BUILD
  # ==========================================
  test:
    name: Test and Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Project Structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f Dockerfile
          test -f requirements.txt
          test -f k8s/deployment.yaml

          echo "Required project files are present."

      - name: Run Python Tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          docker build -t retail-orders-api:test .

          echo "Docker image built successfully."

  # ==========================================
  # JOB 2: DEPLOY TO GOOGLE CLOUD
  # ==========================================
  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest

    needs: test

    # Deploy only after a push to feature.
    # Pull requests run tests but do not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      CLUSTER_NAME: ${{ vars.GKE_CLUSTER }}
      REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      IMAGE_NAME: retail-orders-api

    steps:

      # ------------------------------------------
      # STEP 1: CHECK OUT SOURCE CODE
      # ------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------
      # STEP 2: NORMALIZE CONFIGURATION VARIABLES
      # ------------------------------------------
      - name: Normalize Deployment Variables
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ID="$(printf '%s' "${PROJECT_ID}" | tr -d '\r\n' | xargs)"
          REGION="$(printf '%s' "${REGION}" | tr -d '\r\n' | xargs)"
          CLUSTER_NAME="$(printf '%s' "${CLUSTER_NAME}" | tr -d '\r\n' | xargs)"
          REPOSITORY="$(printf '%s' "${REPOSITORY}" | tr -d '\r\n' | xargs)"

          if [[ -z "${PROJECT_ID}" ]]; then
            echo "ERROR: GCP_PROJECT_ID is empty."
            exit 1
          fi

          if [[ -z "${REGION}" ]]; then
            echo "ERROR: GCP_REGION is empty."
            exit 1
          fi

          if [[ -z "${CLUSTER_NAME}" ]]; then
            echo "ERROR: GKE_CLUSTER is empty."
            exit 1
          fi

          if [[ -z "${REPOSITORY}" ]]; then
            echo "ERROR: ARTIFACT_REGISTRY_REPOSITORY is empty."
            exit 1
          fi

          {
            echo "PROJECT_ID=${PROJECT_ID}"
            echo "REGION=${REGION}"
            echo "CLUSTER_NAME=${CLUSTER_NAME}"
            echo "REPOSITORY=${REPOSITORY}"
          } >> "$GITHUB_ENV"

          echo "Deployment variables validated."
          echo "Project ID: ${PROJECT_ID}"
          echo "Region: ${REGION}"
          echo "Repository: ${REPOSITORY}"
          echo "GKE cluster: ${CLUSTER_NAME}"

      # ------------------------------------------
      # STEP 3: AUTHENTICATE WITH GOOGLE CLOUD
      # ------------------------------------------
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      # ------------------------------------------
      # STEP 4: INSTALL GOOGLE CLOUD SDK
      # ------------------------------------------
      - name: Set Up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ------------------------------------------
      # STEP 5: VERIFY GOOGLE CLOUD AUTHENTICATION
      # ------------------------------------------
      - name: Verify Google Cloud Authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking authenticated Google Cloud account..."

          gcloud auth list

          echo "Checking configured project..."

          gcloud config set project "${PROJECT_ID}" --quiet

          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"

          if [[ "${ACTIVE_PROJECT}" != "${PROJECT_ID}" ]]; then
            echo "ERROR: Google Cloud project does not match."
            exit 1
          fi

          echo "Google Cloud authentication verified."
          echo "Project: ${ACTIVE_PROJECT}"

      # ------------------------------------------
      # STEP 6: CONFIGURE DOCKER AUTHENTICATION
      # ------------------------------------------
      - name: Configure Docker Authentication
        shell: bash
        run: |
          set -euo pipefail

          # Remove accidental spaces and line breaks.
          REGION="$(printf '%s' "${REGION}" | tr -d '\r\n' | xargs)"
          export REGION

          REGISTRY="${REGION}-docker.pkg.dev"

          echo "Configuring Docker authentication..."
          echo "Registry: ${REGISTRY}"

          gcloud auth configure-docker "${REGISTRY}" --quiet

          echo "Checking Docker credential helper configuration..."

          python -c '
          import json
          import os
          from pathlib import Path

          region = os.environ["REGION"].strip()
          registry = f"{region}-docker.pkg.dev"

          config_path = Path.home() / ".docker" / "config.json"

          if not config_path.exists():
              raise SystemExit(
                  f"Docker configuration file not found: {config_path}"
              )

          with config_path.open(encoding="utf-8") as file:
              config = json.load(file)

          helpers = config.get("credHelpers", {})
          actual = helpers.get(registry)

          print(f"Expected registry: {registry}")
          print(f"Configured helper: {actual}")

          if actual != "gcloud":
              raise SystemExit(
                  f"Expected gcloud credential helper for {registry}; "
                  f"found {actual}"
              )

          print("Docker credential helper configured successfully.")
          '

      # ------------------------------------------
      # STEP 7: VERIFY ARTIFACT REGISTRY ACCESS
      # ------------------------------------------
      - name: Verify Artifact Registry Access
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Google Cloud access token..."

          gcloud auth print-access-token > /dev/null

          echo "Checking Artifact Registry repository..."

          gcloud artifacts repositories describe "${REPOSITORY}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}"

          echo "Artifact Registry repository is accessible."

      # ------------------------------------------
      # STEP 8: BUILD AND PUSH DOCKER IMAGE
      # ------------------------------------------
      - name: Build and Push Docker Image
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="${GITHUB_SHA}"

          REGISTRY="${REGION}-docker.pkg.dev"

          IMAGE_URI="${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

          echo "Building Docker image..."
          echo "Image: ${IMAGE_URI}"

          docker build -t "${IMAGE_URI}" .

          echo "Pushing image to Artifact Registry..."

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Docker image pushed successfully."

      # ------------------------------------------
      # STEP 9: CONNECT TO GKE CLUSTER
      # ------------------------------------------
      - name: Connect to GKE Cluster
        shell: bash
        run: |
          set -euo pipefail

          echo "Connecting to GKE cluster: ${CLUSTER_NAME}"

          gcloud container clusters get-credentials "${CLUSTER_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}"

          echo "Checking Kubernetes cluster connection..."

          kubectl cluster-info

          kubectl get nodes

      # ------------------------------------------
      # STEP 10: UPDATE KUBERNETES DEPLOYMENT
      # ------------------------------------------
      - name: Deploy Application to GKE
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Kubernetes deployment manifest..."

          test -f k8s/deployment.yaml

          if ! grep -q 'IMAGE_PLACEHOLDER' k8s/deployment.yaml; then
            echo "ERROR: IMAGE_PLACEHOLDER was not found in k8s/deployment.yaml."
            echo "Update the image field in your manifest."
            exit 1
          fi

          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" \
            k8s/deployment.yaml > deployment-rendered.yaml

          echo "Applying Kubernetes manifests..."

          kubectl apply -f deployment-rendered.yaml

          echo "Kubernetes deployment manifest applied."

      # ------------------------------------------
      # STEP 11: WAIT FOR ROLLOUT
      # ------------------------------------------
      - name: Verify Deployment Rollout
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for application deployment..."

          kubectl rollout status deployment/retail-orders \
            --timeout=300s

          echo "Deployment rollout completed."

      # ------------------------------------------
      # STEP 12: VERIFY DEPLOYMENT RESOURCES
      # ------------------------------------------
      - name: Verify Application
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking deployments..."
          kubectl get deployments

          echo "Checking pods..."
          kubectl get pods -o wide

          echo "Checking services..."
          kubectl get services

          echo "===================================="
          echo "CI/CD pipeline completed successfully."
          echo "===================================="