apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retail-orders
  template:
    metadata:
      labels:
        app: retail-orders
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:////tmp/orders.db"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: retail-orders
spec:
  type: ClusterIP
  selector:
    app: retail-orders
  ports:
    - port: 8000
      targetPort: 8000